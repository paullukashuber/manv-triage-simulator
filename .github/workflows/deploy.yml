name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/manv-triage-app' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # GHCR image names must be lowercase.
      - name: Derive image names
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "API_IMAGE=ghcr.io/${owner}/manv-triage-simulator-api" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/${owner}/manv-triage-simulator-web" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}

      # The files travel base64-encoded inside the SSH session, so the deploy needs no SCP and no
      # writable home directory on the server, only a writable DEPLOY_PATH.
      - name: Encode compose file and .env.example
        run: |
          echo "COMPOSE_B64=$(base64 -w0 deploy/docker-compose.yml)" >> "$GITHUB_ENV"
          echo "ENV_EXAMPLE_B64=$(base64 -w0 deploy/.env.example)" >> "$GITHUB_ENV"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DEPLOY_PATH,COMPOSE_B64,ENV_EXAMPLE_B64
          script: |
            set -eu
            if [ ! -d "$DEPLOY_PATH" ] || [ ! -w "$DEPLOY_PATH" ]; then
              echo "Fehler: $DEPLOY_PATH fehlt oder ist für $(id -un) nicht beschreibbar. Siehe deploy/README.md, Ersteinrichtung." >&2
              exit 1
            fi
            cd "$DEPLOY_PATH"
            printf '%s' "$COMPOSE_B64" | base64 -d > docker-compose.yml.new
            mv docker-compose.yml.new docker-compose.yml
            printf '%s' "$ENV_EXAMPLE_B64" | base64 -d > .env.example.new
            mv .env.example.new .env.example
            if [ ! -f .env ]; then
              echo "Fehler: $DEPLOY_PATH/.env fehlt. docker-compose.yml und .env.example liegen jetzt dort; .env nach deploy/README.md, Ersteinrichtung, anlegen und den Workflow erneut starten." >&2
              exit 1
            fi
            docker compose pull
            docker compose up -d --remove-orphans
