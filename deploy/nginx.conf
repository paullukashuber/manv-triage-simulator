server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    # Docker's DNS, re-resolved so an api-only redeploy (new container IP) keeps working.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # With a variable and no URI part, nginx forwards the original request URI unchanged.
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    }

    # add_header is not inherited by a location that sets its own, so every location below
    # states its complete Cache-Control. Do not add server-level add_header lines expecting
    # them to reach these locations.

    # Hashed file names: a new build never reuses a URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html (also served as the SPA fallback; the internal redirect to /index.html
    # matches this location again) must be revalidated, or browsers keep an old shell that
    # references assets of the previous build.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
